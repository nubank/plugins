name: video_player
description: Flutter plugin for displaying inline video with other Flutter
  widgets on Android, iOS, and web.

version: 2.2.19

publish_to: none

environment:
  sdk: ">=2.14.0 <3.0.0"
  flutter: ">=2.8.0"

flutter:
  plugin:
    platforms:
      android:
        default_package: video_player_android
      ios:
        default_package: video_player_avfoundation
      web:
        default_package: video_player_web

dependencies:
  flutter:
    sdk: flutter
  html: ^0.15.0
  video_player_android: 2.3.4
  video_player_avfoundation:
    path: ../video_player_avfoundation
  video_player_platform_interface: 4.2.0
  video_player_web: 2.0.15

dev_dependencies:
  flutter_test:
    sdk: flutter
